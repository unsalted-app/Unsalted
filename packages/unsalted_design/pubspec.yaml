name: unsalted_design
description: "Design-System von unsalted: Tokens, Theme, Layout, Komponenten und Templates. Nur Flutter, keine Fachbegriffe."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Teil 1.3 D02: Schrift des Design-Systems (SIL OFL 1.1, lib/fonts/OFL.txt),
  # verlustfrei aus den WOFF2 der Übergabe umgewandelt (docs/decisions.md).
  # Referenz im Code: AppFonts.family mit package: 'unsalted_design'.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: lib/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: lib/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
  assets:
    - lib/fonts/OFL.txt
